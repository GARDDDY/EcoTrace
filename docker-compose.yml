services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ecotrace
    env_file:
      - ./EcoTraceServer/.env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ecotrace"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - app-network

  node-app:
    build: .
    image: gddd-ecotrace:latest
    container_name: gddd-ecotrace
    restart: unless-stopped
    env_file:
      - ./EcoTraceServer/.env
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:35288/ping', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    volumes:
      - uploads-data:/app/uploads
    networks:
      - app-network
      - web

volumes:
  pg-data:
  uploads-data:

networks:
  app-network:
  web:
    external: true
