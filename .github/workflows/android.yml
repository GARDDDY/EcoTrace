name: Android CI

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      android: ${{ steps.filter.outputs.android }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            android:
              - 'EcoTrace/**'
              - '.github/workflows/android.yml'

  build:
    needs: changes
    # Тег всегда собирает релиз, даже если сам коммит не трогал EcoTrace/
    if: needs.changes.outputs.android == 'true' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── Java 17 is required by AGP 8.x ───────────────────────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'


      - name: Create local.properties
        env:
          SERVER_API_URI: ${{ secrets.SERVER_API_URI }}
          MAPKIT_API_KEY: ${{ secrets.MAPKIT_API_KEY }}
          TRANSLATE_WEB_PAGE: ${{ secrets.TRANSLATE_WEB_PAGE }}
          TRANSLATE_EXPRESSION: ${{ secrets.TRANSLATE_EXPRESSION }}
        run: |
          {
            echo "sdk.dir=$ANDROID_HOME"
            echo "SERVER_API_URI=\"$SERVER_API_URI\""
            echo "MAPKIT_API_KEY=\"$MAPKIT_API_KEY\""
            echo "TRANSLATE_WEB_PAGE=\"$TRANSLATE_WEB_PAGE\""
            echo "TRANSLATE_EXPRESSION=\"$TRANSLATE_EXPRESSION\""
          } > EcoTrace/local.properties

      - name: Make gradlew executable
        run: chmod +x EcoTrace/gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon
        working-directory: EcoTrace

      - name: Upload debug APK as artifact
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: ecotrace-debug-${{ github.sha }}
          path: EcoTrace/app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: EcoTrace/app/build/outputs/apk/debug/*.apk
          generate_release_notes: true
